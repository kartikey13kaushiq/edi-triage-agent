[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "edi-triage-agent"
version = "0.2.0"
description = "Supervisor-worker LangGraph agent that triages B2B/EDI transfer failures with RAG and a human approval gate."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Kartikey Kaushiq" }]
dependencies = [
  "langgraph>=1.0",
  "pydantic>=2.7",
  "anthropic>=1.0",
]

[project.optional-dependencies]
postgres = ["langgraph-checkpoint-postgres>=3.0", "psycopg[binary,pool]>=3.2"]
api = ["fastapi>=0.115", "uvicorn[standard]>=0.30"]
observability = ["langfuse>=3.0"]
# Any LLM provider via agentkit-core: pip install "agentkit-core @ git+https://github.com/kartikey13kaushiq/agentkit"
providers = ["agentkit-core"]
dev = ["pytest>=8", "httpx>=0.27", "fastapi>=0.115", "ruff>=0.6"]

[project.scripts]
edi-triage = "edi_triage.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/edi_triage"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
